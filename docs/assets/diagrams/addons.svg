<text x="36" y="146" fill="#383939" font-size="10.5" opacity="0.92">Chat and inline completion, under your control</text>
<circle cx="40" cy="165" r="3.5" fill="#DF9E2F"/>
<text x="50" y="169" fill="#383939" font-size="12.5" font-weight="700">Claude Code</text>
<text x="50" y="177" fill="#676869" font-size="10.5">AI chat and agentic coding inside a terminal split.</text>
<circle cx="40" cy="200" r="3.5" fill="#DF9E2F"/>
<text x="50" y="204" fill="#383939" font-size="12.5" font-weight="700">GitHub Copilot</text>
<text x="50" y="212" fill="#676869" font-size="10.5">Inline ghost-text completion you accept as you type.</text>
