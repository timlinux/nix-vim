<svg xmlns="http://www.w3.org/2000/svg" width="1204" height="1101" viewBox="0 0 1204 1101" font-family="Nunito,'Helvetica Neue',Arial,sans-serif">
<rect width="1204" height="1101" fill="#FFFFFF"/>
<text x="24" y="34" fill="#676869" font-size="12" font-weight="700" letter-spacing="3">TIMVIM · ADD-ONS &amp; COMPONENTS</text>
