<text x="442" y="247" fill="#676869" font-size="10.5">Fast, accurate syntax highlighting and code objects.</text>
<circle cx="432" cy="270" r="3.5" fill="#06969A"/>
<text x="442" y="274" fill="#383939" font-size="12.5" font-weight="700">conform.nvim</text>
