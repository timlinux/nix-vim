<text x="428" y="130" fill="#FFFFFF" font-size="15" font-weight="800">Language &amp; LSP</text>
<text x="428" y="146" fill="#FFFFFF" font-size="10.5" opacity="0.92">Diagnostics, formatting, completion and syntax</text>
<circle cx="432" cy="165" r="3.5" fill="#06969A"/>
<text x="442" y="169" fill="#383939" font-size="12.5" font-weight="700">nvim-lspconfig + lspsaga</text>
<text x="442" y="177" fill="#676869" font-size="10.5">Language servers with a polished diagnostics UI.</text>
<circle cx="432" cy="200" r="3.5" fill="#06969A"/>
<text x="442" y="204" fill="#383939" font-size="12.5" font-weight="700">Language modules</text>
<text x="442" y="212" fill="#676869" font-size="10.5">Per-language LSP, formatting, DAP and treesitter, via NVF.</text>
<circle cx="432" cy="235" r="3.5" fill="#06969A"/>
