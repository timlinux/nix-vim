<svg xmlns="http://www.w3.org/2000/svg" width="864" height="398" viewBox="0 0 864 398" font-family="Nunito,'Helvetica Neue',Arial,sans-serif">
<rect width="864" height="398" fill="#FFFFFF"/>
<text x="24" y="34" fill="#676869" font-size="12" font-weight="700" letter-spacing="3">TIMVIM · COMPLETION &amp; AI KEYS</text>
<text x="24" y="62" fill="#383939" font-size="24" font-weight="800">Two systems, one muscle memory</text>
<rect x="24" y="84" width="396" height="290" rx="10" fill="#FFFFFF" stroke="#D1D1D1"/>
<path d="M24,94 q0,-10 10,-10 h376 q10,0 10,10 v34 h-396 z" fill="#569FC6"/>
<text x="40" y="114" fill="#FFFFFF" font-size="16" font-weight="800">Completion menu</text>
<text x="404" y="114" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="end" opacity="0.9" font-family="JetBrains Mono,monospace">blink-cmp</text>
